---
apiVersion: v1
kind: Namespace
metadata:
  name: ws-cbs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ws-cbs
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "" # Ensures it runs on the control plane node
      containers:
        - name: postgres
          image: postgres:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "user"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "url_shortener_db"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ws-cbs
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  clusterIP: None # Headless service for internal DB connection
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ws-cbs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ws-cbs
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "" # Ensures deployment on worker nodes
      containers:
        - name: auth-service
          image: andreicalindragomir/ws-cbs:auth_service
          ports:
            - containerPort: 5001
          env:
            - name: DATABASE_URL
              value: "postgresql://user:password@postgres.ws-cbs/url_shortener_db"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ws-cbs
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
  type: ClusterIP # Not exposed externally
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: ws-cbs
  labels:
    app: url-shortener
spec:
  replicas: 3
  selector:
    matchLabels:
      app: url-shortener
  template:
    metadata:
      labels:
        app: url-shortener
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "" # Ensures deployment on worker nodes
      containers:
        - name: url-shortener
          image: andreicalindragomir/ws-cbs:url_shortener_service
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "postgresql://user:password@postgres.ws-cbs/url_shortener_db"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service.ws-cbs:5001"
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener
  namespace: ws-cbs
spec:
  selector:
    app: url-shortener
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP # Not exposed externally
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ws-cbs-ingress
  namespace: ws-cbs
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/auth/
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 5001
          - path: /api/shorten/
            pathType: Prefix
            backend:
              service:
                name: url-shortener
                port:
                  number: 5000
