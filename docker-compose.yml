version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: grp331
      POSTGRES_PASSWORD: Group33
      POSTGRES_DB: url_shortener_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  auth_service:
    build:
      context: .
      dockerfile: Dockerfile.login
    container_name: auth_service
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://grp331:Group33@db/url_shortener_db
    ports:
      - "5001:5001"

  url_shortener:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: url_shortener
    depends_on:
      - db
      - auth_service
    environment:
      - DATABASE_URL=postgresql://grp331:Group33@db/url_shortener_db
      - AUTH_SERVICE_URL=http://auth_service:5001
    ports:
      - "5000:5000"

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    depends_on:
      - url_shortener
      - auth_service
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"

  redis:
    image: redis:latest
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

volumes:
  db_data:
