version: '3.8'

services:
  postgres_db:
    image: postgres:latest
    container_name: postgres_db
    restart: on-failure
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: url_shortener_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d url_shortener_db"]
      interval: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432"

  auth_service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth_service
    restart: on-failure
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_db/url_shortener_db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://auth_service:5001/health || exit 1"]
      interval: 30s
      retries: 3
      timeout: 10s
    ports:
      - "5001"

  url_shortener_service:
    build:
      context: ./url_shortener
      dockerfile: Dockerfile
    container_name: url_shortener_service
    restart: on-failure
    depends_on:
      postgres_db:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_db/url_shortener_db
      - AUTH_SERVICE_URL=http://auth_service:5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://url_shortener_service:5000/health"]
      interval: 30s
      retries: 3
      timeout: 10s
    ports:
      - "5000"

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      url_shortener_service:
        condition: service_healthy
      auth_service:
        condition: service_healthy

  redis:
    image: redis:latest
    container_name: redis_cache
    restart: always
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      retries: 3
      timeout: 10s
    ports:
      - "6379"

volumes:
  db_data:
